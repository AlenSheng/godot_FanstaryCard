  workflow_dispatch:

permissions:
  contents: read

jobs:
  accounting:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: server/global.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install load generator metrics dependency
        run: python -m pip install psutil==7.0.0
      - name: Offline accounting and process tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results/gameplay-accounting
          git rev-parse HEAD > test-results/gameplay-accounting/source-sha.txt
          python --version > test-results/gameplay-accounting/python-version.txt
          python -m unittest discover -s tools/tests -v 2>&1 | tee test-results/gameplay-accounting/unittest.log
          python -m unittest discover -s tools/cloud/pr13 -v 2>&1 | tee test-results/gameplay-accounting/cloud-ownership.log
          python tools/pr13_control_cases.py --output test-results/gameplay-accounting/control-contract-cases
          python tools/pr13_candidate_cases.py --output test-results/gameplay-accounting/candidate-contract-cases
          python tools/pr13_review_cases.py --output test-results/gameplay-accounting/review-policy-cases
          python tools/pr13_experience_metric_cases.py --output test-results/gameplay-accounting/experience-metric-cases
          python tools/pr13_probe_cases.py --output test-results/gameplay-accounting/probe-contract-cases
          dotnet run --project server/tools/FantasyCard.ConfigExporter -c Release --artifacts-path "$RUNNER_TEMP/pr13-config-build" -- --input "$PWD/config/FantasyCard_Config.xlsx" --version gdd-0.70-numerical-1 --server-output "$PWD/test-results/gameplay-accounting/config-export/server" --client-output "$PWD/test-results/gameplay-accounting/config-export/client"
          python tools/pr13_source_cases.py --config-export test-results/gameplay-accounting/config-export --output test-results/gameplay-accounting/source-contract-cases
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gameplay-load-accounting-${{ github.sha }}
          path: test-results/gameplay-accounting
          retention-days: 7
          if-no-files-found: error

  client:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install Godot from official distribution
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot" test-results/gameplay-load
          curl --fail --location --retry 2 'https://downloads.godotengine.org/?version=4.7.2&flavor=stable&slug=linux.x86_64.zip&platform=linux.64' -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
          "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" --version | tee test-results/gameplay-load/godot-version.txt
          grep -q '^4\.7\.2\.' test-results/gameplay-load/godot-version.txt
      - name: Import and run client checks with networking disabled
        shell: bash
        run: |
          set -euo pipefail
          export XDG_DATA_HOME="$RUNNER_TEMP/godot-offline/data"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/godot-offline/config"
          export XDG_CACHE_HOME="$RUNNER_TEMP/godot-offline/cache"
          godot="$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
          sudo -E unshare -n timeout 600 "$godot" --headless --path client --editor --import --quit > test-results/gameplay-load/import.log 2>&1
          sudo -E unshare -n timeout 90 "$godot" --headless --path client --script res://tests/run_gameplay_load_parse.gd > test-results/gameplay-load/load-parse.log 2>&1
          FANTASYCARD_LOAD_RUN_ID=pr13-cleanup-authority sudo -E unshare -n timeout 90 "$godot" --headless --path client --script res://tests/test_cleanup_ticket_authority.gd > test-results/gameplay-load/cleanup-authority.log 2>&1
          sudo -E unshare -n timeout 90 "$godot" --headless --path client --script res://tests/run_play_retry.gd > test-results/gameplay-load/client.log 2>&1
          ! grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' test-results/gameplay-load/*.log
          grep -q 'Gameplay load client parses' test-results/gameplay-load/load-parse.log
          grep -q 'CLEANUP_TICKET_AUTHORITY.*"ok":true' test-results/gameplay-load/cleanup-authority.log
      - name: Loopback HTTP completeness and protocol fixtures
        shell: bash
        run: |
          set -euo pipefail
          godot="$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
          python client/tests/run_http_boundary.py --godot "$godot" --output test-results/gameplay-load/http-boundary --tls-fault
          python client/tests/run_http_protobuf_client.py --godot "$godot" --work-dir test-results/gameplay-load/http-fixture
          python tools/pr13_offline_cases.py --godot "$godot" --output test-results/gameplay-load/offline-cases
          python tools/pr13_fault_cases.py --godot "$godot" --output test-results/gameplay-load/fault-cases
          python tools/pr13_audit_cases.py --output test-results/gameplay-load/audit-cases
          python tools/pr13_boundary_cases.py --godot "$godot" --output test-results/gameplay-load/boundary-cases
          python tools/pr13_ui_cases.py --godot "$godot" --output test-results/gameplay-load/ui-contract-cases
          python tools/pr13_state_cases.py --godot "$godot" --output test-results/gameplay-load/state-contract-cases
          python tools/pr13_ready_edge_cases.py --godot "$godot" --output test-results/gameplay-load/ready-edge-cases
          python tools/pr13_ready_edge_cases.py --script prelaunch --godot "$godot" --output test-results/gameplay-load/prelaunch-boundary-cases
          python tools/pr13_http_cases.py --godot "$godot" --output test-results/gameplay-load/http-context-cases
          python tools/pr13_http_cases.py --godot "$godot" --output test-results/gameplay-load/http-context-per-request --transport per-request
          python tools/pr13_ledger_cases.py --output test-results/gameplay-load/ledger-contract-cases
          A3GAME_GODOT_EXECUTABLE="$godot" python tools/pr13_callback_isolation.py --output test-results/gameplay-load/callback-isolation
          FANTASYCARD_SERVER_URL=http://127.0.0.1:1 "$godot" --headless --path client --script res://tests/run_gateway_origin.gd > test-results/gameplay-load/gateway-origin.log 2>&1
          grep -q '"ok":true' test-results/gameplay-load/gateway-origin.log
          ! grep -E 'SCRIPT ERROR|Parse Error' test-results/gameplay-load/gateway-origin.log
      - name: Same-session callback races
        shell: bash
        run: |
          set -euo pipefail
          export XDG_DATA_HOME="$RUNNER_TEMP/godot-offline/data"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/godot-offline/config"
          export XDG_CACHE_HOME="$RUNNER_TEMP/godot-offline/cache"
          sudo -E unshare -n timeout 60 "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" --headless --path client --script res://tests/run_lobby_race.gd > test-results/gameplay-load/lobby-race.log 2>&1
          grep -q '"ok":true' test-results/gameplay-load/lobby-race.log
          ! grep -E 'SCRIPT ERROR|Parse Error' test-results/gameplay-load/lobby-race.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gameplay-load-client-${{ github.sha }}
          path: test-results/gameplay-load
          retention-days: 7
          if-no-files-found: ignore

  server-contract:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: server/global.json
      - name: Full server offline regression
        shell: pwsh
        working-directory: server
        run: |
          dotnet test tests/FantasyCard.Server.Tests/FantasyCard.Server.Tests.csproj -c Release --logger 'trx;LogFileName=server-offline.trx' --results-directory ../test-results/gameplay-load
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gameplay-load-server-${{ github.sha }}
          path: test-results/gameplay-load
          retention-days: 7
          if-no-files-found: ignore

  server-postgres:
    runs-on: ubuntu-latest
    # Includes the separately pinned historical build and real client faults.
    # Individual test deadlines and performance redlines remain unchanged.
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: ready_stop_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ready_stop_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --label codex.scope=disposable-local
          --label codex.task=pr13-stages-20261008
    env:
      FANTASYCARD_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Username=postgres;Password=postgres;Database=ready_stop_ci
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: server/global.json
      - name: Install pinned Godot for real client and PostgreSQL fault checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot-pg" test-results/gameplay-load
          curl --fail --location --retry 2 'https://downloads.godotengine.org/?version=4.7.2&flavor=stable&slug=linux.x86_64.zip&platform=linux.64' -o "$RUNNER_TEMP/godot-pg.zip"
          unzip -q "$RUNNER_TEMP/godot-pg.zip" -d "$RUNNER_TEMP/godot-pg"
          executable="$RUNNER_TEMP/godot-pg/Godot_v4.7.2-stable_linux.x86_64"
          chmod +x "$executable"
          "$executable" --version | tee test-results/gameplay-load/godot-pg-version.txt
          grep -q '^4\.7\.2\.' test-results/gameplay-load/godot-pg-version.txt
          echo "A3GAME_GODOT_EXECUTABLE=$executable" >> "$GITHUB_ENV"
          echo "FANTASYCARD_PROCESS_EVIDENCE=$GITHUB_WORKSPACE/outputs/pr13-local-20261008/ci-process-faults" >> "$GITHUB_ENV"
      - name: Build immutable pinned previous server for code and native backup rollback
        shell: bash
        env:
          OWNED_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          previous=0cf43dba7a28e936f82bc3e73ed9c6427092c2fb
          previous_source="$RUNNER_TEMP/pr13-previous-source"
          previous_runtime="$GITHUB_WORKSPACE/outputs/pr13-local-20261008/ci-previous-0cf43db"
          mkdir -p "$previous_source" "$previous_runtime" test-results/gameplay-load
          git fetch --no-tags --depth=1 https://github.com/AlenSheng/godot_FanstaryCard.git "$previous"
          git archive "$previous" server protocol config \
            ':(exclude)server/.packages' ':(exclude)server/.artifacts' \
            ':(exclude,glob)**/bin/**' ':(exclude,glob)**/obj/**' \
            | tar -xf - -C "$previous_source"
          # Run from the current server directory so the already-pinned SDK is used.
          (cd server && dotnet publish "$previous_source/server/src/FantasyCard.Server/FantasyCard.Server.csproj" -c Release --no-self-contained --artifacts-path "$RUNNER_TEMP/pr13-previous-build" --output "$previous_runtime" -p:UseSharedCompilation=false) 2>&1 | tee test-results/gameplay-load/previous-server-build.log
          test -s "$previous_runtime/FantasyCard.Server.dll"
          previous_hash="$(sha256sum "$previous_runtime/FantasyCard.Server.dll" | cut -d ' ' -f1)"
          dotnet --version > test-results/gameplay-load/rollback-sdk-version.txt
          printf '%s\n' "$previous" > test-results/gameplay-load/previous-source-sha.txt
          (cd "$previous_runtime" && find . -type f -print0 | sort -z | xargs -0 sha256sum) > test-results/gameplay-load/previous-runtime-sha256.txt
          echo "FANTASYCARD_PROCESS_PREVIOUS_SERVER_DLL=$previous_runtime/FantasyCard.Server.dll" >> "$GITHUB_ENV"
          echo "FANTASYCARD_PROCESS_PREVIOUS_SERVER_SHA256=$previous_hash" >> "$GITHUB_ENV"
          echo "FANTASYCARD_PROCESS_SOURCE_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "FANTASYCARD_TEST_DOCKER_CONTAINER=$OWNED_POSTGRES_CONTAINER" >> "$GITHUB_ENV"
      - name: Full server and runtime integration on disposable PostgreSQL
        working-directory: server
        run: dotnet test tests/FantasyCard.Server.Tests/FantasyCard.Server.Tests.csproj -c Release --logger 'trx;LogFileName=postgres-full.trx' --results-directory ../test-results/gameplay-load
      - name: Require complete native PostgreSQL rows with no skips
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from tools.pr13_suite_coverage import assess_trx
          required = {
              'Persisted_current_contract_does_not_revive_obsolete_boolean_or_remainder_API': 1,
              'Default_persisted_constructor_stays_current_rhythm_and_current_steps': 1,
              'Explicit_candidate_enums_survive_database_restore_and_have_independent_assertions': 1,
              'Persisted_resolver_context_preserves_first_core_floor_tuning_and_dual_element_contracts': 1,
              'Exact_GDD_fire_contexts_restore_from_database_to_46_72_113': 1,
              'Priest_card_heal_and_conflict_E0_remain_separate_after_database_restore': 1,
              'New_policy_source_changes_new_rooms_without_changing_current_persisted_room': 1,
              'Persisted_PVP_working_copy_restores_complete_original_PVE_and_policy': 1,
              'Missing_legacy_policy_fields_use_defaults_and_invalid_values_reject_before_mutation': 1,
              'Actual_code_rollback_and_native_backup_restore_preserve_once_only_assets': 1,
          }
          result = assess_trx(Path('test-results/gameplay-load/postgres-full.trx'), required)
          Path('test-results/gameplay-load/postgres-coverage.json').write_text(json.dumps(result, indent=2) + '\n')
          if result['state'] != 'CoveredForMainReview':
              raise SystemExit(3)
          PY
      - name: Preserve owned process evidence and native rollback dump
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -d outputs/pr13-local-20261008/ci-process-faults ]; then
            mkdir -p test-results/gameplay-load/process-faults
            cp -a outputs/pr13-local-20261008/ci-process-faults/. test-results/gameplay-load/process-faults/
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gameplay-load-postgres-${{ github.sha }}
          path: test-results/gameplay-load
          retention-days: 7
          if-no-files-found: ignore
