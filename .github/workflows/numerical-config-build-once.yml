name: Finalize numerical config
on:
  push:
    branches: ['codex/numerical-integration-20260928']
    paths: ['.github/workflows/numerical-config-build-once.yml']
permissions:
  contents: read
jobs:
  publish:
    if: github.repository == 'AlenSheng/godot_FanstaryCard' && github.ref == 'refs/heads/codex/numerical-integration-20260928'
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      source: ${{ steps.commit.outputs.source }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/numerical-integration-20260928
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: server/global.json
      - name: Apply narrowly scoped source wiring
        shell: python
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          import pathlib, subprocess, os
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==os.environ['EXPECTED_HEAD'], 'Branch moved'
          def replace(path,old,new,count=1):
              p=pathlib.Path(path); text=p.read_text(encoding='utf-8')
              assert text.count(old)==count,(path,text.count(old),count)
              p.write_text(text.replace(old,new),encoding='utf-8',newline='\n')
          path='server/tools/FantasyCard.Numerics/Program.cs'
          replace(path,'StartsWith("M", StringComparison.Ordinal)',"StartsWith('M')",2)
          replace(path,'StartsWith("E", StringComparison.Ordinal)',"StartsWith('E')",2)
          replace('tools/export-config.ps1','gdd-0.68-element-tuning-1','gdd-0.70-numerical-1')
          replace('server/tests/FantasyCard.Domain.Tests/Configuration/GameConfigCatalogTests.cs','gdd-0.68-element-tuning-1','gdd-0.70-numerical-1')
          replace('client/ui/equipment_compare_dialog.gd','\t_build_actions(body)','\tvar effective := Button.new()\n\teffective.text = preload("res://ui/numerical_details.gd").text("title")\n\teffective.pressed.connect(func(): preload("res://ui/numerical_details.gd").show_compare(self, _loadout, _selected))\n\tbody.add_child(effective)\n\t_build_actions(body)')
          marker='\ttext(P.localized("enhance_progress"), Rect2(1375, 175, 450, 70), 38, P.GOLD)'
          replace('client/ui/reference_ui.gd',marker,'\tif not selected.is_empty():\n\t\tbutton(preload("res://ui/numerical_details.gd").text("title"), Rect2(730, 940, 350, 54), func(): preload("res://ui/numerical_details.gd").show_compare(host, host._equipped_items(), selected, true))\n'+marker)
          marker='\tvar duel: Dictionary = state.get("duel", {})'
          replace('client/ui/exploration_view.gd',marker,'\tvar numerics: Dictionary = state.get("player", {}).get("numerical_state", {})\n\tif numerics.get("guardian_policy", "") == "FractionalRemainder" and Game.hero_class == "Guardian":\n\t\tui.button("%d / 10" % int(numerics.get("guardian_remainder_tenths", 0)), Rect2(1580, 35, 120, 62), func(): preload("res://ui/numerical_details.gd").show_remainder(host))\n'+marker)
      - name: Export config and client projection
        shell: pwsh
        run: |
          ./tools/export-config.ps1 -ConfigVersion gdd-0.70-numerical-1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify typed flags and commit only generated and selected files
        id: commit
        shell: python
        run: |
          import pathlib,json,subprocess,os
          catalog=json.loads(pathlib.Path('client/data/catalog.json').read_text(encoding='utf-8'))
          assert catalog['version']=='gdd-0.70-numerical-1'
          row=catalog['tables']['NumericalRules'][0]
          for key in ['cards_spent_draw','fractional_guardian','optional_monster_pool','budgeted_bot_loot','mortal_bot_pve']: assert row[key] is False,(key,row[key])
          assert pathlib.Path('server/config/generated/fantasycard.config.bytes').read_bytes()==pathlib.Path('client/data/generated/fantasycard.config.bytes').read_bytes()
          paths=['server/tools/FantasyCard.Numerics/Program.cs','tools/export-config.ps1','server/tests/FantasyCard.Domain.Tests/Configuration/GameConfigCatalogTests.cs','client/ui/equipment_compare_dialog.gd','client/ui/reference_ui.gd','client/ui/exploration_view.gd','server/config/generated','client/data/generated','client/data/catalog.json']
          subprocess.run(['git','add','--',*paths],check=True)
          subprocess.run(['git','rm','--','.github/workflows/numerical-config-build-once.yml'],check=True)
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','commit','-m','feat: publish v0.70 disabled config and effective loadout UI'],check=True)
          sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          subprocess.run(['git','push','origin','HEAD:refs/heads/codex/numerical-integration-20260928'],check=True)
          with open(os.environ['GITHUB_OUTPUT'],'a') as out: out.write('source='+sha+'\n')
  verify:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        target: [domain, server, routes]
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.publish.outputs.source }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: server/global.json
      - name: Execute numerical acceptance
        shell: pwsh
        working-directory: server
        env:
          TARGET: ${{ matrix.target }}
        run: |
          New-Item -ItemType Directory -Force ../test-results/numerics | Out-Null
          if ($env:TARGET -eq 'domain') {
            dotnet test tests/FantasyCard.Domain.Tests/FantasyCard.Domain.Tests.csproj -c Release --logger 'trx;LogFileName=domain.trx' --results-directory ../test-results/numerics 2>&1 | Tee-Object ../test-results/numerics/domain.log
          } elseif ($env:TARGET -eq 'server') {
            dotnet test tests/FantasyCard.Server.Tests/FantasyCard.Server.Tests.csproj -c Release --logger 'trx;LogFileName=server.trx' --results-directory ../test-results/numerics 2>&1 | Tee-Object ../test-results/numerics/server.log
          } else {
            dotnet run --project tools/FantasyCard.Numerics -c Release -- --samples 10000 --players 1 --seed-start 0 2>&1 | Tee-Object ../test-results/numerics/routes.log
          }
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: numerical-${{ matrix.target }}-${{ needs.publish.outputs.source }}
          path: test-results/numerics
          retention-days: 7
          if-no-files-found: ignore
