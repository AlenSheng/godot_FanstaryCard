name: Apply numerical integration once
on:
  push:
    branches: ['codex/numerical-integration-20260928']
    paths: ['.github/workflows/numerical-integrate-once.yml']
permissions:
  contents: read
jobs:
  apply:
    if: github.repository == 'AlenSheng/godot_FanstaryCard' && github.ref == 'refs/heads/codex/numerical-integration-20260928'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      source: ${{ steps.apply.outputs.source }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/numerical-integration-20260928
      - name: Validate and apply source changes
        id: apply
        shell: python
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          import os, pathlib, re, subprocess, base64, zlib, json, hashlib, io, zipfile
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          assert git('rev-parse','HEAD') == os.environ['EXPECTED_HEAD'], 'Branch moved; do not overwrite newer work.'
          base = pathlib.Path('.codex/integration-transport')
          paths = [base / (name + '.patch') for name in ('domain','server','client','tests')]
          expected = {}
          for path in paths:
              text = path.read_text()
              sections = text.split('diff --git ')[1:]
              path.write_text(''.join('diff --git ' + section.rstrip('\n') + '\n' for section in sections))
              for section in sections:
                  lines = section.splitlines()
                  header = re.fullmatch(r'a/(\S+) b/(\S+)', lines[0])
                  assert header and header[1] == header[2], 'Unexpected rename/path.'
                  name = header[1]
                  assert name.startswith(('server/src/', 'server/tests/', 'client/', 'protocol/')) and '..' not in pathlib.PurePosixPath(name).parts
                  match = re.search(r'^index ([0-9a-f]+)\.\.([0-9a-f]+)', section, re.M)
                  assert match, name
                  old, new = match.groups()
                  current = pathlib.Path(name)
                  if set(old) == {'0'}:
                      assert not current.exists(), 'New file already exists: ' + name
                  else:
                      assert git('hash-object',name).startswith(old), 'Baseline differs: ' + name
                  assert name not in expected, 'Duplicate patch path.'
                  expected[name] = new
          subprocess.run(['git','apply','--check','--recount',*[str(p) for p in paths]], check=True)
          subprocess.run(['git','apply','--recount','--whitespace=nowarn',*[str(p) for p in paths]], check=True)
          for name, prefix in expected.items():
              assert git('hash-object',name).startswith(prefix), 'Applied bytes differ from reviewed source: ' + name
          # Transport the already-exported artifact-tool workbook without reauthoring any table.
          encoded = (base / 'workbook.b64').read_text().strip().replace('+OPvnX3/65', '+OPvnXx3/65')
          raw = zlib.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(raw).hexdigest() == '4e0863d7a52923f237e2e6518fa734a39910bdff5ab4fefd2ae6ead629e88f7f'
          export = json.loads(raw)
          workbook = pathlib.Path('config/FantasyCard_Config.xlsx')
          assert git('hash-object',str(workbook)) == export['old_blob'], 'Workbook changed; reconcile first.'
          oldzip = zipfile.ZipFile(io.BytesIO(workbook.read_bytes()))
          target = io.BytesIO()
          with zipfile.ZipFile(target,'w',zipfile.ZIP_DEFLATED) as output:
              for part in export['parts']:
                  name = part['name']
                  original = oldzip.read(name) if name in oldzip.namelist() else b''
                  tokens = re.split(b'(?=<)',original)
                  result = original if 'ops' not in part else b''.join(b''.join(tokens[op[0]:op[1]]) if isinstance(op,list) else op.encode('utf-8') for op in part['ops'])
                  assert hashlib.sha256(result).hexdigest() == part['hash'], name
                  info = zipfile.ZipInfo(name,(2026,9,28,0,0,0))
                  output.writestr(info,result,compress_type=zipfile.ZIP_DEFLATED)
          workbook.write_bytes(target.getvalue())
          subprocess.run(['git','add','--',*expected,str(workbook)], check=True)
          subprocess.run(['git','rm','-r','-f','--','.codex/integration-transport','.github/workflows/numerical-integrate-once.yml'], check=True)
          subprocess.run(['git','config','user.name','github-actions[bot]'], check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git','commit','-m','feat: integrate bounded monster pool, bot loot, locked policies and client protocol'], check=True)
          source = git('rev-parse','HEAD')
          subprocess.run(['git','push','origin','HEAD:refs/heads/codex/numerical-integration-20260928'], check=True)
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              output.write('source=' + source + '\n')
          print('Committed verified source files:',len(expected),source)
  test:
    needs: apply
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.apply.outputs.source }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: server/global.json
      - name: Domain tests
        shell: pwsh
        working-directory: server
        run: |
          dotnet test tests/FantasyCard.Domain.Tests/FantasyCard.Domain.Tests.csproj -c Release --logger 'trx;LogFileName=domain.trx' --results-directory ../test-results/numerics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Server contract tests
        shell: pwsh
        working-directory: server
        run: |
          dotnet test tests/FantasyCard.Server.Tests/FantasyCard.Server.Tests.csproj -c Release --filter 'FullyQualifiedName~NumericalProtocolTests' --logger 'trx;LogFileName=numerical-protocol.trx' --results-directory ../test-results/numerics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Legal route simulation
        shell: pwsh
        working-directory: server
        run: |
          dotnet run --project tools/FantasyCard.Numerics -c Release -- --samples 10000 --players 1 --seed-start 0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: numerical-test-results-${{ needs.apply.outputs.source }}
          path: test-results/numerics
          if-no-files-found: ignore
          retention-days: 7
