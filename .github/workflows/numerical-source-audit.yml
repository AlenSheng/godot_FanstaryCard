name: Numerical source audit
on:
  push:
    branches: ['codex/ag-03-guardian-shield-remainder-20260928']
    paths: ['.github/workflows/numerical-source-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Bundle tracked source only
        shell: python
        run: |
          import json, pathlib, subprocess, zipfile
          root = pathlib.Path.cwd()
          names = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          suffixes = {'.cs', '.csproj', '.props', '.targets', '.slnx', '.md', '.gd', '.tscn', '.proto', '.toml'}
          exact = {'server/global.json', 'client/project.godot', 'config/FantasyCard_Config.xlsx', 'server/config/fantasycard.config.bytes'}
          prefixes = ('server/src/', 'server/tests/', 'server/tools/', 'client/', 'protocol/', 'docs/', '.codex/')
          excluded = {'bin', 'obj', 'artifacts', '.artifacts', '.godot', '.dotnet', '.packages', 'local-backups'}
          included = []
          with zipfile.ZipFile('numerical-source.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for name in names:
                  path = pathlib.PurePosixPath(name)
                  if not name or excluded.intersection(path.parts):
                      continue
                  if name in exact or (path.suffix in suffixes and (name.startswith(prefixes) or len(path.parts) == 1 or (len(path.parts) == 2 and path.parts[0] == 'server'))):
                      source = root / name
                      if source.is_file() and source.stat().st_size < 2_000_000:
                          archive.write(source, name)
                          included.append(name)
              archive.writestr('SOURCE_MANIFEST.json', json.dumps({'sourceSha': sha, 'files': included}, indent=2))
          print(f'Captured {len(included)} source files at {sha}; no environment files, private keys, binaries or deployment backups.')
      - uses: actions/upload-artifact@v7
        with:
          name: numerical-source-${{ github.sha }}
          path: numerical-source.zip
          retention-days: 1
          if-no-files-found: error
