name: Numerical integration validation
on:
  pull_request:
    branches: [release]
    paths:
      - 'server/**'
      - 'client/**'
      - 'config/**'
      - 'protocol/**'
      - 'tools/numerics/**'
      - '.github/workflows/numerics-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: numerics-${{ github.ref }}
  cancel-in-progress: true
jobs:
  server-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: fc_ci_only
          POSTGRES_DB: fc_numerics_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fc_numerics_ci"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      FANTASYCARD_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Database=fc_numerics_ci;Username=postgres;Password=fc_ci_only
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Capture source-only diagnostic snapshot
        run: python tools/numerics/package_diagnostic_sources.py "${{ runner.temp }}/fc-sources.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: numerics-sources-${{ github.run_id }}
          path: ${{ runner.temp }}/fc-sources.zip
          retention-days: 1
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: server/global.json
      - name: Validate evidence parser
        run: python -m unittest discover -s tools/numerics -p 'test_validation_runner.py' -v
      - name: Build, run tests, and validate route simulations
        run: python tools/numerics/run_validation.py --samples 10000 --output "${{ runner.temp }}/fc-numerics-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Preserve actual test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: numerics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fc-numerics-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn
          retention-days: 14
      - name: Prepare offline compiler for this integration only
        if: always() && github.event.pull_request.number == 11 && github.event.pull_request.head.repo.full_name == github.repository
        run: python tools/numerics/package_offline_toolchain.py "${{ runner.temp }}/fc-toolchain.tar.gz"
      - name: Preserve private offline diagnostic toolchain
        if: always() && github.event.pull_request.number == 11 && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v4
        with:
          name: numerics-toolchain-${{ github.run_id }}
          path: ${{ runner.temp }}/fc-toolchain.tar.gz
          if-no-files-found: error
          retention-days: 1
