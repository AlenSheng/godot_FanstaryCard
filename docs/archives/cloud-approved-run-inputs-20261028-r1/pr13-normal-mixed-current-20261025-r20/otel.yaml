receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 127.0.0.1:18594
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 96
    spike_limit_mib: 24
  batch:
    timeout: 1s
    send_batch_size: 256
exporters:
  prometheus:
    endpoint: 127.0.0.1:18595
    resource_to_telemetry_conversion:
      enabled: true
service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
