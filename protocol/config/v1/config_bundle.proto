syntax = "proto3";
package fantasycard.config.v1;

enum ValueType { VALUE_TYPE_UNSPECIFIED = 0; STRING = 1; INT64 = 2; DOUBLE = 3; BOOL = 4; }
enum PublishScope { PUBLISH_SCOPE_UNSPECIFIED = 0; BOTH = 1; SERVER = 2; CLIENT = 3; }
message ConfigBundle { string config_version = 1; bytes content_hash = 2; repeated ConfigTable tables = 3; }
message ConfigTable { string name = 1; repeated ConfigColumn columns = 2; repeated ConfigRow rows = 3; }
message ConfigColumn { string name = 1; ValueType value_type = 2; bool required = 3; PublishScope scope = 4; string description = 5; }
message ConfigRow { repeated ConfigValue values = 1; }
message ConfigValue {
  oneof value { string string_value = 1; int64 int64_value = 2; double double_value = 3; bool bool_value = 4; bool is_null = 5; }
}