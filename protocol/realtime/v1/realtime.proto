syntax = "proto3";
package fantasycard.realtime.v1;

// Each WebSocket binary message contains exactly one envelope.
message ClientEnvelope {
  uint32 protocol_version = 1;
  string type = 2;
  string request_id = 3;
  optional int64 expected_revision = 4;
  bytes payload = 5;
}

message ServerEnvelope {
  uint32 protocol_version = 1;
  string type = 2;
  string trace_id = 3;
  bytes payload = 4;
  string event_id = 5;
  int64 sequence = 6;
  int64 occurred_at_unix_ms = 7;
  string request_id = 8;
  optional int64 room_revision = 9;
}

message SessionResumeCommand { int64 last_sequence = 1; string room_id = 2; optional int64 room_revision = 3; }
message SessionConnectedEvent { string player_id = 1; }
message SessionReplacedEvent { string reason = 1; }
message PongEvent { int64 server_time_unix_ms = 1; }
message SessionSnapshotEvent {
  string player_id = 1;
  int64 player_version = 2;
  string selected_class = 3;
  string reason = 4;
  int64 previous_last_sequence = 5;
}
message MatchFoundEvent { string match_id = 1; string room_id = 2; int64 deadline_unix_ms = 3; }
message RoomReadyCommand {}
message RoomReadyRequiredEvent {
  string match_id = 1;
  string room_id = 2;
  int64 deadline_unix_ms = 3;
  int32 ready_players = 4;
  int32 required_players = 5;
}
message RoomReadyAcceptedEvent {
  string match_id = 1;
  string room_id = 2;
  int64 deadline_unix_ms = 3;
  int32 ready_players = 4;
  int32 required_players = 5;
}
message RoomReadyRemovedEvent { string match_id = 1; string reason = 2; }
message RoomSnapshotCommand {}
message RoomPosition { int32 row = 1; int32 column = 2; }
message RoomMapCell { int32 row = 1; int32 column = 2; bool is_boss = 3; bool has_spring = 4; }
message RoomCard { string instance_id = 1; string card_id = 2; int32 level = 3; optional string element_override = 4; }
message RoomCombatant { int32 hp = 1; int32 maximum_hp = 2; int32 effective_maximum_hp = 3; int32 shield = 4; }
message RoomStat { string key = 1; string value = 2; }
message RoomSet { string kind = 1; int32 count = 2; int32 required = 3; bool active = 4; }
message RoomBattleStatus { string passive_kind = 1; int32 combo = 2; string core_element = 3; repeated RoomStat bonuses = 4; repeated RoomSet sets = 5; string draw_interval_seconds = 6; int32 charge_level = 7; }
message RoomEquipment { string slot = 1; string quality = 2; string element = 3; string effect_affix = 4; string secondary_trait = 5; int32 level = 6; bool is_bound = 7; }
message RoomInventoryItem { string item_id = 1; string kind = 2; int32 quantity = 3; bool is_safe = 4; RoomEquipment equipment = 5; optional int32 slot_index = 6; }
message RoomRelicPile { string pile_id = 1; string owner_name = 2; int64 version = 3; repeated RoomInventoryItem items = 4; }
message RoomMonster {
  string monster_id = 1;
  int32 maximum_hp = 2;
  int32 hp = 3;
  int32 shield = 4;
  string intent_kind = 5;
  int32 intent_value = 6;
  string intent_element = 7;
  int64 interval_progress_ms = 8;
  int64 windup_remaining_ms = 9;
  int64 stun_remaining_ms = 10;
  // Authoritative completed stage, 1 or 2; absent on older servers means stage 1.
  int32 boss_phase = 11;
}
message RoomPve { string battle_id = 1; string phase = 2; string current_target_id = 3; repeated RoomMonster monsters = 4; }
message RoomDuel {
  string duel_id = 1;
  string opponent_id = 2;
  RoomCombatant opponent = 3;
  int64 late_player_unlock_at_unix_ms = 4;
  int64 leave_window_ends_at_unix_ms = 5;
  bool self_requested_leave = 6;
  optional int64 escape_remaining_ms = 7;
  string opponent_class = 8;
  string opponent_name = 9;
  string escape_probability = 10;
  RoomBattleStatus opponent_status = 11;
  int64 opponent_stun_remaining_ms = 12;
  int64 opponent_draw_block_remaining_ms = 13;
}
message RoomCurrentCell { bool has_evacuation = 1; string monster_group_id = 2; bool spring_consumed = 3; repeated string relic_pile_ids = 4; repeated RoomRelicPile relic_piles = 5; }
message RoomPlayer {
  string player_id = 1;
  string hero_class = 2;
  string phase = 3;
  RoomCombatant combat = 4;
  repeated RoomCard hand = 5;
  int32 library_count = 6;
  int32 discard_count = 7;
  string draw_charge = 8;
  repeated RoomInventoryItem inventory = 9;
  int32 inventory_capacity = 10;
  repeated int32 safe_slot_indexes = 11;
  repeated RoomInventoryItem equipped_items = 12;
  int32 weapon_level = 13;
  RoomBattleStatus battle_status = 14;
  int64 stun_remaining_ms = 15;
  int64 draw_block_remaining_ms = 16;
  int64 draw_speed_remaining_ms = 17;
  int64 draw_block_speed_remaining_ms = 18;
  string base_draw_interval_seconds = 19;
}
message RoomSnapshotEvent {
  string room_id = 1;
  string match_id = 2;
  int64 room_revision = 3;
  string config_version = 4;
  RoomPosition self = 5;
  repeated RoomMapCell map = 6;
  repeated RoomPosition legal_moves = 7;
  RoomCurrentCell current_cell = 8;
  RoomPlayer player = 9;
  RoomPve pve = 10;
  RoomDuel duel = 11;
  RewardChoiceEvent reward_choice = 12;
  optional int64 extraction_remaining_ms = 13;
  optional int64 spring_remaining_ms = 14;
  repeated string allowed_actions = 15;
}
message RoomStartedEvent {
  string match_id = 1;
  string room_id = 2;
  int32 player_count = 3;
  RoomSnapshotEvent snapshot = 4;
}
message SettlementReadyEvent { string settlement_id = 1; string match_id = 2; string result = 3; }
message CommandRejectedEvent {
  string code = 1;
  string detail = 2;
}

message BattlePlayCardsCommand {
  string battle_id = 1;
  string target_id = 2;
  repeated string card_instance_ids = 3;
}

message BattleComboResolvedEvent {
  string battle_id = 1;
  string attacker_id = 2;
  string target_id = 3;
  int32 damage = 4;
  int32 shield_damage = 5;
  int32 hp_damage = 6;
  int32 heal = 7;
  int32 shield_gain = 8;
  bool target_defeated = 9;
  bool battle_ended = 10;
  repeated CombatDamageSegment damage_segments = 11;
  string core_element = 12;
  int32 core_count = 13;
  string stun_seconds = 14;
  string draw_block_seconds = 15;
  int32 health_cost = 16;
  string draw_charge = 17;
  int32 immediate_draw = 18;
  repeated string card_instance_ids = 19;
  string source_id = 20;
  string draw_speed_seconds = 21;
  string draw_speed_modifier = 22;
  string draw_block_speed_seconds = 23;
}
message CombatDamageSegment { string kind = 1; int32 amount = 2; }
message BattleSelectTargetCommand { string battle_id = 1; string target_id = 2; }
message BattleAbandonCommand {}
message BattleTargetSelectedEvent { string battle_id = 1; string target_id = 2; }

message RewardChoiceRefreshCommand {}
message RewardChoiceClaimCommand { string option_id = 1; string replace_item_id = 2; bool equip = 3; }
message RewardChoiceOption { string option_id = 1; int32 kind = 2; string item_id = 3; int32 quantity = 4; int32 heal_percent = 5; RoomEquipment equipment = 6; }
message RewardChoiceEvent { int32 layer = 1; repeated RewardChoiceOption options = 2; int32 refresh_count = 3; bool is_boss = 4; }
message RewardChoiceClaimedEvent { string option_id = 1; int32 applied = 2; }
message RoomMovedEvent { string player_id = 1; int32 row = 2; int32 column = 3; }
message DuelLeaveEvent { string duel_id = 1; bool completed = 2; }
// Probability is an invariant-culture decimal string, matching the existing v1 wire encoding.
message DuelEscapeEvent { string duel_id = 1; string probability = 2; string status = 3; }
message ActionExtractEvent { string status = 1; int64 remaining_ms = 2; }
message ActionSpringEvent { string status = 1; int64 remaining_ms = 2; }
message ActionPotionEvent { string item_id = 1; int32 healed = 2; }
message RelicTakeEvent { string pile_id = 1; string item_id = 2; int64 pile_version = 3; }
message RelicReadCommand { string pile_id = 1; }
message RelicReplaceCommand { string pile_id = 1; string item_id = 2; int64 pile_version = 3; string replace_item_id = 4; }
message RelicReplacedEvent { string pile_id = 1; string item_id = 2; string returned_item_id = 3; int64 pile_version = 4; }
message InventoryMoveCommand { string item_id = 1; int32 target_slot_index = 2; }
message InventoryEquipCommand { string item_id = 1; }
message InventoryUnequipCommand { string slot = 1; }
message MarketEquipment {
  string instance_id = 1;
  string slot = 2;
  string quality = 3;
  int32 level = 4;
  bool is_bound = 5;
  string location = 6;
  int64 version = 7;
  string element = 8;
  string effect_affix = 9;
  string secondary_trait = 10;
}
message MarketListing {
  string listing_id = 1;
  string seller_id = 2;
  string equipment_id = 3;
  int64 price_gold = 4;
  string status = 5;
  int64 version = 6;
  int64 created_at_unix_ms = 7;
  int64 expires_at_unix_ms = 8;
  MarketEquipment equipment = 9;
}
message InventoryChangedEvent {
  string action = 1;
  string item_id = 2;
  MarketListing listing = 3;
  optional int64 seller_gold_after = 4;
}
message RoomMoveCommand { int32 row = 1; int32 column = 2; }
message DuelLeaveCommand { string duel_id = 1; }
message DuelEscapeCommand { string duel_id = 1; }
message ActionExtractCommand {}
message ActionSpringCommand {}
message ActionPotionCommand {}
message RelicTakeCommand { string pile_id = 1; string item_id = 2; int64 pile_version = 3; string replace_item_id = 4; }
message DuelStartedEvent { string duel_id = 1; string first_player_id = 2; string late_player_id = 3; int64 late_player_unlock_at_unix_ms = 4; int64 leave_window_ends_at_unix_ms = 5; }
message DuelEndedEvent { string duel_id = 1; string reason = 2; string winner_id = 3; bool snapshot_required = 4; }
message PlayerDiedEvent { string player_id = 1; string cause = 2; string duel_id = 3; }
