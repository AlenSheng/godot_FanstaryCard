name: fantasycard-cloud

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: fantasycard
      POSTGRES_USER: fantasycard
      POSTGRES_PASSWORD: ${FANTASYCARD_DB_PASSWORD:?set FANTASYCARD_DB_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fantasycard -d fantasycard"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - fantasycard-postgres:/var/lib/postgresql
    restart: unless-stopped
    logging:
      options:
        max-size: "20m"
        max-file: "3"

  server:
    build:
      context: .
      dockerfile: src/FantasyCard.Server/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      Identity__EnableLocalAuth: "true"
      Admin__ApiKey: ${FANTASYCARD_ADMIN_KEY:-}
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=fantasycard;Username=fantasycard;Password=${FANTASYCARD_DB_PASSWORD}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    logging:
      options:
        max-size: "20m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "20000:20000"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/etc/caddy/certs:ro
    depends_on:
      server:
        condition: service_started
    restart: unless-stopped
    logging:
      options:
        max-size: "20m"
        max-file: "3"

volumes:
  fantasycard-postgres:
  caddy-data:
  caddy-config:
