services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: fantasycard
      POSTGRES_USER: fantasycard
      POSTGRES_PASSWORD: fantasycard_dev
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fantasycard -d fantasycard"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - fantasycard-postgres:/var/lib/postgresql

  server:
    build:
      context: .
      dockerfile: src/FantasyCard.Server/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=fantasycard;Username=fantasycard;Password=fantasycard_dev
    ports:
      - "5080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  fantasycard-postgres:
