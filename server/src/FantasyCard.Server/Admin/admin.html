<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>遗境行者后台管理 · Relicbound Admin</title>
<style>
body{font:15px/1.5 system-ui,sans-serif;background:#101827;color:#e9eef8;margin:0}main{max-width:1100px;margin:auto;padding:24px}h1{font-size:24px;margin:0 0 16px}h2{font-size:18px;margin:0 0 12px}section{background:#1b2638;border:1px solid #34445b;border-radius:10px;padding:18px;margin:14px 0}label{display:block;margin:8px 0 3px;color:#bcd0e8}input,select,textarea{box-sizing:border-box;width:100%;padding:9px;background:#0e1725;color:#fff;border:1px solid #4c5d75;border-radius:5px;font:inherit}textarea{min-height:85px}input[type=checkbox]{width:auto;margin-right:8px}button{background:#3579ca;border:0;color:white;border-radius:5px;padding:9px 14px;margin:10px 8px 0 0;cursor:pointer;font:inherit}button.danger{background:#a83e47}button:disabled{opacity:.5;cursor:default}.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.card{background:#111d2d;padding:12px;border-radius:7px;margin:9px 0}.muted{color:#9db0c6}.error{color:#ff9f9f}.ok{color:#9de4ae}#result,#settingsResult{white-space:pre-wrap}small{color:#9db0c6}
</style>
</head>
<body><main>
<h1>遗境行者后台管理 · Relicbound Admin</h1>
<section><label for="key">管理密钥（仅保存在此页面内存）</label><input id="key" type="password" autocomplete="off"><small>请通过 HTTPS 访问。关闭或刷新页面后需重新输入。</small></section>
<section><h2>测试服登录与版本公告</h2><button id="loadSettings">读取当前设置</button><label><input id="localLogin" type="checkbox">启用测试服本地登录 / 注册</label><label for="announcementTitle">公告标题</label><input id="announcementTitle" maxlength="120" placeholder="版本公告"><label for="announcementBody">公告正文</label><textarea id="announcementBody" maxlength="6000" rows="10" placeholder="发布后，所有在线客户端的登录页会立即更新"></textarea><button id="publishSettings">保存并发布到客户端</button><p id="settingsResult" role="status"></p></section>
<section><h2>查找玩家</h2><div class="row"><div><label for="query">UID / 账号 / 精确昵称</label><input id="query" autocomplete="off"></div><div><button id="search">查找</button></div></div><div id="players"></div></section>
<section><h2>操作玩家</h2><label for="uid">玩家 UID</label><input id="uid" readonly><div class="card"><strong>一键养成</strong><br><small>操作立即写入选定账号并留下审计记录；“全部装备”会补齐尚未拥有的 150 种品质、元素与部位组合。</small><br><button id="unlockAllCards">解锁全部卡牌图鉴</button><button id="maxAllCards">全部已解锁卡牌满级</button><button id="grantAllEquipment">获取全部装备</button><button id="maxExistingEquipment">现有装备满级</button></div><button id="equipment">查看背包装备</button><div id="equipmentList"></div><div class="row"><div><label for="title">邮件标题</label><input id="title" value="系统通知"></div><div><label for="kind">道具类型</label><select id="kind"></select></div><div><label for="amount">数量</label><input id="amount" type="number" min="1" max="1000000" value="1"></div><div><label for="itemId">装备规格 / 装备实例 ID</label><input id="itemId" placeholder="发放例：White|Fire|Head"></div></div><label for="body">邮件内容 / 留言</label><textarea id="body"></textarea><button id="grant">发放道具邮件</button><button id="message">发送留言</button><label for="reason">收回或封号原因</label><input id="reason"><button id="revoke" class="danger">收回道具并通知</button><button id="ban" class="danger">封号</button><button id="unban">解封</button><p id="result" role="status"></p></section>
</main>
<script>
const $=id=>document.getElementById(id);
const kinds=['Gold','Diamond','WarriorSoul','PriestSoul','MageSoul','GuardianSoul','EquipmentFragments','HealthPotion','AdvancedBag','TopBag','Equipment'];
for(const kind of kinds){const option=document.createElement('option');option.value=kind;option.textContent=kind;$('kind').append(option)}
async function api(path,method='GET',data){const headers={'X-Admin-Key':$('key').value};if(data){headers['Content-Type']='application/json';headers['Idempotency-Key']=crypto.randomUUID()}const response=await fetch('/api/admin'+path,{method,headers,body:data?JSON.stringify(data):undefined,cache:'no-store'});if(!response.ok){let detail='HTTP '+response.status;try{const problem=await response.json();detail=problem.detail||problem.title||detail}catch{}throw Error(detail)}return response.json()}
function show(message,error=false){$('result').textContent=message;$('result').className=error?'error':'ok'}
function operationResult(operation,response){if(operation==='grant')return `已投递道具邮件（${response.mailId}）。`;if(operation==='message')return `已发送留言（${response.mailId}）。`;if(operation==='ban')return '封号已生效：该账号当前会话已断开，之后无法登录。';if(operation==='unban')return '账号已解封，可以重新登录。';return JSON.stringify(response,null,2)}
let settingsVersion=null;
function settingsStatus(message,error=false){$('settingsResult').textContent=message;$('settingsResult').className=error?'error':'ok'}
async function loadSettings(){try{settingsStatus('读取中…');const settings=await api('/client-settings');settingsVersion=settings.version;$('localLogin').checked=settings.localLoginEnabled;$('announcementTitle').value=settings.announcementTitle;$('announcementBody').value=settings.announcementBody;settingsStatus('当前版本 '+settings.version+'，更新时间 '+new Date(settings.updatedAt).toLocaleString())}catch(error){settingsStatus(error.message,true)}}
$('loadSettings').onclick=loadSettings;
$('publishSettings').onclick=async()=>{try{if(settingsVersion===null)throw Error('请先读取当前设置');settingsStatus('发布中…');const settings=await api('/client-settings','PUT',{localLoginEnabled:$('localLogin').checked,announcementTitle:$('announcementTitle').value,announcementBody:$('announcementBody').value,expectedVersion:settingsVersion});settingsVersion=settings.version;settingsStatus('已发布，版本 '+settings.version+'；在线客户端已收到更新')}catch(error){settingsStatus(error.message,true)}};
function selected(){const playerId=$('uid').value;if(!playerId)throw Error('请先查找并选择玩家');return playerId}
async function run(work){try{show('处理中…');const response=await work();if(response!==undefined)show(JSON.stringify(response,null,2))}catch(error){show(error.message,true)}}
$('search').onclick=()=>run(async()=>{const players=await api('/players?q='+encodeURIComponent($('query').value.trim()));const box=$('players');box.replaceChildren();for(const player of players){const card=document.createElement('div');card.className='card';const text=document.createElement('div');text.textContent=`${player.displayName} | ${player.userId} | ${player.provider||''} ${player.account||''} | 金币 ${player.gold} | 装备 ${player.equipmentCount} | ${player.isBanned?'已封号':'正常'}`;const select=document.createElement('button');select.textContent='选择';select.onclick=()=>{$('uid').value=player.userId;show('已选择 '+player.displayName)};card.append(text,select);box.append(card)}if(!players.length)box.textContent='没有找到玩家';return {count:players.length}});
$('equipment').onclick=()=>run(async()=>{const items=await api('/players/'+selected()+'/equipment');const box=$('equipmentList');box.replaceChildren();for(const item of items){const row=document.createElement('div');row.className='card';row.textContent=`${item.quality} ${item.element||''} ${item.slot} +${item.level} | ${item.instanceId}`;const choose=document.createElement('button');choose.textContent='选择收回';choose.onclick=()=>{$('kind').value='Equipment';$('itemId').value=item.instanceId;$('amount').value='1'};row.append(choose);box.append(row)}if(!items.length)box.textContent='背包中没有装备';return {count:items.length}});
function bulk(path,label){return run(async()=>{const playerId=selected();if(!confirm(`确认对当前选定账号执行“${label}”？此操作会立即生效。`))return;const response=await api(path,'POST',{playerId});const parts=[];if(response.cards)parts.push(`卡牌 ${response.cards} 张`);if(response.equipment)parts.push(`装备 ${response.equipment} 件`);if(response.weapons)parts.push(`专属武器 ${response.weapons} 把`);show(`${label}完成${parts.length?'：'+parts.join('，'):'（没有需要变更的资产）'}。`)});}
$('unlockAllCards').onclick=()=>bulk('/players/unlock-all-cards','解锁全部卡牌图鉴');
$('maxAllCards').onclick=()=>bulk('/players/max-all-cards','全部已解锁卡牌满级');
$('grantAllEquipment').onclick=()=>bulk('/players/grant-all-equipment','获取全部装备');
$('maxExistingEquipment').onclick=()=>bulk('/players/max-existing-equipment','现有装备满级');
$('grant').onclick=()=>run(async()=>{const response=await api('/mail','POST',{playerId:selected(),title:$('title').value,body:$('body').value,attachments:[{kind:$('kind').value,amount:Number($('amount').value),itemId:$('kind').value==='Equipment'?$('itemId').value:null}]});show(operationResult('grant',response))});
$('message').onclick=()=>run(async()=>{const response=await api('/message','POST',{playerId:selected(),title:$('title').value,body:$('body').value});show(operationResult('message',response))});
$('revoke').onclick=()=>run(()=>api('/revoke','POST',{playerId:selected(),kind:$('kind').value,amount:Number($('amount').value),itemId:$('kind').value==='Equipment'?$('itemId').value:null,reason:$('reason').value}));
$('ban').onclick=()=>run(async()=>{if(!$('reason').value.trim())throw Error('请填写封号原因');const response=await api('/ban','POST',{playerId:selected(),reason:$('reason').value});show(operationResult('ban',response))});
$('unban').onclick=()=>run(async()=>{const response=await api('/unban','POST',{playerId:selected(),reason:''});show(operationResult('unban',response))});
</script>
</body></html>
